<!-- Header -->
<header class="site-header" :class="{ 'scrolled': scrolled }" role="banner">
  <div class="container">
    <a href="/index.html" class="logo" aria-label="Faith Over Fear home">F<span class="logo-accent">&gt;</span>F</a>

    <input type="checkbox" id="menu-toggle" class="menu-toggle" style="display: none;">
    <label for="menu-toggle" class="hamburger" aria-hidden="true"><span></span></label>

    <nav id="primary-nav" class="primary-nav" role="navigation">
      <ul class="nav-list">
        <li><a href="/index.html">Home</a></li>
        <li><a href="/shop.html">New Arrivals</a></li>
        <li><a href="/lookbook.html">LOOKBOOK</a></li>
        <li><a href="/about.html">About</a></li>
        <li><a href="/contact.html">Contact</a></li>
        <template x-if="!user">
            <li><a href="/login.html" class="text-fof-accent">Login</a></li>
        </template>
        <template x-if="user">
            <li class="relative group flex flex-col items-center">
                <button class="text-sm font-semibold text-fof-accent flex items-center space-x-2">
                    <span x-text="user.name"></span>
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
                </button>
                <div class="absolute left-1/2 top-full w-48 h-2 -translate-x-1/2 bg-transparent pointer-events-auto"></div>
                <div class="absolute left-1/2 top-full mt-1 w-48 min-w-[160px] -translate-x-1/2 z-[999] bg-zinc-900 border border-zinc-800 shadow-xl flex flex-col overflow-hidden opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none group-hover:pointer-events-auto">
                    <a href="/reservations.html"
                            class="block w-full text-left px-4 py-3 text-sm font-medium text-white border-b border-zinc-800 hover:bg-zinc-800 transition-colors">
                        My Reservations
                    </a>
                    <button @click="localStorage.removeItem('fof_token'); localStorage.removeItem('fof_user'); window.location.reload()"
                            class="block w-full text-left px-4 py-3 text-sm font-medium text-white hover:bg-zinc-800 transition-colors">
                        Logout
                    </button>
                </div>
            </li>
        </template>
        <li class="cta"><a href="/cart.html">Cart</a></li>
      </ul>
    </nav>
  </div>
</header>
