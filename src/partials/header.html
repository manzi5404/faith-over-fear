<!-- Header -->
<header class="site-header" :class="{ 'scrolled': scrolled }" role="banner">

  <div class="rail">
    <a class="logo" href="/index.html" aria-label="Faith Over Fear home">F<span class="logo-accent">&gt;</span>F</a>

    <input type="checkbox" id="menu-toggle" class="menu-toggle" hidden>

    <label for="menu-toggle" id="mb">Menu</label>

    <nav id="primary-nav" role="navigation">
      <a href="/index.html">Home</a>
      <a href="/shop.html">New Arrivals</a>
      <a href="/lookbook.html">LOOKBOOK</a>
      <a href="/about.html">About</a>
      <a href="/contact.html">Contact</a>
      <template x-if="!user">
        <a href="/login.html" class="text-fof-accent">Login</a>
      </template>
      <template x-if="user">
        <span class="relative group flex flex-col items-start" style="width:max-content">
          <button class="text-sm font-semibold text-fof-accent flex items-center space-x-2">
            <span x-text="user.name"></span>
            <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M19 9l-7 7-7-7"/></svg>
          </button>
          <div class="mt-1 w-48 min-w-[160px] bg-zinc-900 border border-zinc-800 shadow-xl flex flex-col overflow-hidden opacity-0 group-hover:opacity-100 transition-opacity duration-200 pointer-events-none group-hover:pointer-events-auto">
            <a href="/reservations.html" class="block w-full text-left px-4 py-3 text-sm font-medium text-white border-b border-zinc-800 hover:bg-zinc-800 transition-colors">My Reservations</a>
            <button @click="localStorage.removeItem('fof_token'); localStorage.removeItem('fof_user'); window.location.reload()" class="block w-full text-left px-4 py-3 text-sm font-medium text-white hover:bg-zinc-800 transition-colors">Logout</button>
          </div>
        </span>
      </template>
    </nav>

    <small>Kigali, Rwanda</small>
  </div>

  <div class="top">
    <a href="/cart.html" class="cart-link">Cart (<span x-text="(cartItems || []).reduce((a, b) => a + (b.quantity || b.q || 0), 0)">0</span>)</a>
  </div>

  <div id="ov" class="mobile-overlay">
    <label for="menu-toggle" id="mx">Close</label>
    <a href="/index.html">Home</a>
    <a href="/shop.html">New Arrivals</a>
    <a href="/lookbook.html">LOOKBOOK</a>
    <a href="/about.html">About</a>
    <a href="/contact.html">Contact</a>
    <template x-if="!user">
      <a href="/login.html" class="text-fof-accent">Login</a>
    </template>
    <template x-if="user">
      <a href="/reservations.html">My Reservations</a>
      <button @click="localStorage.removeItem('fof_token'); localStorage.removeItem('fof_user'); window.location.reload()" style="text-align:left">Logout</button>
    </template>
    <a href="/cart.html">Cart (<span x-text="(cartItems || []).reduce((a, b) => a + (b.quantity || b.q || 0), 0)">0</span>)</a>
  </div>

</header>
