<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart | F>F</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <style>
        [x-cloak] { display: none !important; }
    </style>
    <!-- Tailwind CSS (Using script specifically for styling consistency in this environment if needed, but linking style.css is preferred) -->

</head>
<body class="has-rail antialiased overflow-x-hidden" 
      x-data="shopLogic()"
      x-init="init()"
      @scroll.window="scrolled = (window.pageYOffset > 50)"
      :class="{ 'scrolled': scrolled }">

    <!-- @@HEADER -->


    <!-- Global Notifications -->
    <div class="fixed bottom-6 right-6 z-[100] space-y-3 pointer-events-none" 
         x-data="{ 
            notifications: [], 
            add(e) { 
                const id = Date.now();
                this.notifications.push({ id, message: e.detail.message, type: e.detail.type });
                setTimeout(() => this.notifications = this.notifications.filter(n => n.id !== id), 3000);
            } 
         }" 
         @notify.window="add($event)">
        <template x-for="n in notifications" :key="n.id">
            <div x-transition:enter="transition ease-out duration-300"
                 x-transition:enter-start="translate-x-full opacity-0"
                 x-transition:enter-end="translate-x-0 opacity-100"
                 x-transition:leave="transition ease-in duration-300"
                 x-transition:leave-start="translate-x-0 opacity-100"
                 x-transition:leave-end="translate-x-full opacity-0"
                 class="pointer-events-auto flex items-center p-4 bg-zinc-900 border border-fof-gray shadow-2xl min-w-[300px]">
                <div class="w-1 h-10 mr-4" :class="n.type === 'success' ? 'bg-green-500' : 'bg-fof-accent'"></div>
                <div class="flex-1">
                    <p class="text-xs uppercase tracking-widest text-gray-500 font-bold mb-0.5" x-text="n.type"></p>
                    <p class="text-sm font-medium" x-text="n.message"></p>
                </div>
            </div>
        </template>
    </div>

    <main class="pt-24 min-h-screen">
        <div class="container mx-auto px-4 md:px-6 py-12">
            <h1 class="text-4xl md:text-5xl font-display font-bold uppercase mb-12">Your <span class="text-fof-accent">Cart</span></h1>

            <!-- Empty Cart State -->
            <div x-show="cartItems.length === 0" class="flex flex-col items-center justify-center py-20 text-center animate-fade-in-up px-4" x-cloak>
                <div class="text-gray-600 mb-6">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="0.5" stroke="currentColor" class="w-24 h-24">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 10.5V6a3.75 3.75 0 1 0-7.5 0v4.5m11.356-1.993 1.263 12c.07.665-.45 1.243-1.119 1.243H4.25a1.125 1.125 0 0 1-1.12-1.243l1.264-12A1.125 1.125 0 0 1 5.513 7.5h12.974c.576 0 1.059.435 1.119 1.007ZM8.625 10.5a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Zm7.5 0a.375.375 0 1 1-.75 0 .375.375 0 0 1 .75 0Z" />
                    </svg>
                </div>
                <h2 class="text-2xl font-bold uppercase mb-4">Your cart is empty</h2>
                <a href="/shop.html" class="bg-fof-accent text-fof-black font-bold uppercase py-3 px-8 text-xs tracking-widest hover:bg-fof-white transition-all transform hover:scale-105 w-full md:w-auto block md:inline-block text-center">Start Shopping</a>
            </div>

            <!-- Cart Content -->
            <div x-show="cartItems.length > 0" class="grid grid-cols-1 lg:grid-cols-3 gap-12" x-transition>
                
                <!-- Items List -->
                <div class="lg:col-span-2 space-y-6">
                    <template x-for="(item, index) in cartItems" :key="index">
                        <div class="flex flex-col md:flex-row items-center bg-zinc-900/50 border border-fof-gray p-6 relative group">
                            
                            <!-- Remove Button -->
                            <button @click="removeFromCart(index)" class="absolute top-4 right-4 text-gray-600 hover:text-red-500 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor" class="w-5 h-5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                                </svg>
                            </button>

                            <!-- Image -->
                            <div class="w-24 md:w-32 aspect-square md:aspect-[4/5] bg-fof-gray mb-6 md:mb-0 md:mr-6 overflow-hidden flex-shrink-0 mx-auto md:mx-0">
                                <img :src="item.images[0]" class="w-full h-full object-cover">
                            </div>

                                <!-- Details -->
                                <div class="flex-1 text-center md:text-left w-full">
                                    <h3 class="font-display font-bold text-xl uppercase tracking-wide mb-1" x-text="item.name"></h3>
                                    <template x-if="item.selectedQuality">
                                        <p class="text-xs text-gray-400 uppercase tracking-widest mb-3" x-text="'Quality: ' + item.selectedQuality"></p>
                                    </template>
                                    <div class="flex items-center gap-2 mb-4">
                                        <p class="text-[10px] text-gray-400 uppercase tracking-widest">Size:</p>
                                        <select 
                                            @change="updateSize(index, $event.target.value)"
                                            class="bg-black border border-zinc-800 text-white text-[10px] uppercase tracking-widest px-2 py-1 focus:border-fof-accent outline-none cursor-pointer rounded-sm"
                                        >
                                            <template x-for="size in ['S', 'M', 'L', 'XL']" :key="size">
                                                <option :value="size" :selected="item.selectedSize === size" x-text="size"></option>
                                            </template>
                                        </select>
                                    </div>
                                    
                                    <div class="flex flex-col md:flex-row items-center justify-between gap-4">
                                        <!-- Quantity Selector -->
                                        <div class="flex items-center bg-black border border-zinc-800 rounded-sm">
                                            <button @click="updateQuantity(index, -1)" class="w-10 h-10 flex items-center justify-center hover:bg-zinc-900 transition-colors text-gray-400">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M20 12H4" stroke-width="2" stroke-linecap="round"/></svg>
                                            </button>
                                            <div class="w-10 text-center font-bold text-sm" x-text="item.quantity"></div>
                                            <button @click="updateQuantity(index, 1)" class="w-10 h-10 flex items-center justify-center hover:bg-zinc-900 transition-colors text-gray-400">
                                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4" stroke-width="2" stroke-linecap="round"/></svg>
                                            </button>
                                        </div>

                                        <div class="text-right">
                                            <div class="text-xs text-gray-500 font-mono" x-text="item.price.toLocaleString() + ' FRW ea'"></div>
                                            <div class="text-xl font-bold font-mono text-white" x-text="(parseFloat(item.price) * parseInt(item.quantity)).toFixed(2) + ' FRW'"></div>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </template>
                </div>

                <!-- Summary Card -->
                <div class="lg:col-span-1">
                    <div class="sticky top-24 bg-zinc-900 border border-fof-gray p-8 shadow-2xl">
                        <h2 class="text-2xl font-display font-bold uppercase mb-6 pb-4 border-b border-zinc-800">Summary</h2>
                        
                        <div class="space-y-4 mb-8">
                            <div class="flex justify-between text-sm text-gray-400">
                                <span>Subtotal</span>
                                <span class="text-white font-mono" x-text="cartTotal + ' FRW'"></span>
                            </div>
                            <div class="flex justify-between text-sm text-gray-400">
                                <span>Deliveries:</span>
                                <span class="text-green-500 font-bold uppercase text-xs tracking-wider">
                                    <a href="contact.html">Contact to arrange delivery</a></span>
                            </div>
                        </div>

                        <div class="flex justify-between items-end border-t border-zinc-800 pt-6 mb-8">
                            <span class="font-bold uppercase tracking-widest text-sm">Total</span>
                            <span class="text-3xl font-display font-bold text-white font-mono" x-text="grandTotal + ' FRW'"></span>
                        </div>

                        <!-- Live Mode Checkout -->
                        <template x-if="isLiveMode()">
                            <button @click="initPayment(null)" class="w-full bg-fof-accent text-fof-black font-bold uppercase py-4 tracking-widest hover:bg-fof-white transition-all transform hover:scale-105 flex items-center justify-center space-x-2">
                                <span>Checkout with MoMo</span>
                                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"></path></svg>
                            </button>
                        </template>

                        <!-- Reserve Mode Block -->
                        <template x-if="isReservationMode()">
                            <div class="space-y-4">
                                <div class="bg-fof-accent/10 border border-fof-accent/20 p-4 text-center">
                                    <p class="text-[10px] text-fof-accent font-bold uppercase tracking-widest">Store is in Reserve Mode</p>
                                    <p class="text-[9px] text-gray-400 uppercase mt-1">Direct checkout is temporarily disabled. Please reserve items on their product pages.</p>
                                </div>
                                <button disabled class="w-full bg-zinc-800 text-gray-500 font-bold uppercase py-4 tracking-widest cursor-not-allowed flex items-center justify-center space-x-2">
                                    <span>Checkout Disabled</span>
                                </button>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Payment Modal (Reused) -->
    <!-- Payment Modal (Redesigned) -->
    <div x-show="paymentModalOpen" 
         class="fixed inset-0 z-[10000] flex items-center justify-center p-4"
         x-transition:enter="transition ease-out duration-300"
         x-transition:enter-start="opacity-0"
         x-transition:enter-end="opacity-100"
         x-transition:leave="transition ease-in duration-200"
         x-transition:leave-start="opacity-100"
         x-transition:leave-end="opacity-0"
         x-cloak>
        <div class="absolute inset-0 bg-black/90 backdrop-blur-sm z-[9998]" @click="paymentModalOpen = false"></div>
        
        <div class="relative z-[10001] bg-zinc-900 border border-fof-gray w-full max-w-lg shadow-2xl overflow-y-auto max-h-[90vh] animate-fade-in-up pointer-events-auto rounded-lg">
            <!-- Modal Header -->
            <div class="p-6 border-b border-zinc-800 flex justify-between items-center sticky top-0 bg-zinc-900 z-10">
                <h3 class="text-xl sm:text-2xl font-display font-bold uppercase tracking-tight">MoMo Checkout</h3>
                <button @click="paymentModalOpen = false" class="text-gray-500 hover:text-white transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>

            <div class="p-6 sm:p-8 space-y-8">
                <!-- User Details Section -->
                <div class="space-y-4">
                    <h4 class="text-[10px] uppercase tracking-[0.2em] text-fof-accent font-bold">1. Your Information</h4>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 items-start">
                        <div>
                            <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1.5 font-bold">Full Name</label>
                            <input type="text" x-model="senderName" placeholder="Enter name" class="w-full bg-black border border-zinc-800 p-3 text-sm focus:border-fof-accent outline-none transition-colors rounded-sm">
                        </div>
                        <div>
                            <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1.5 font-bold">From (MoMo Number)</label>
                            <input type="text" x-model="senderPhone" placeholder="078..." class="w-full bg-black border border-zinc-800 p-3 text-sm focus:border-fof-accent outline-none transition-colors rounded-sm">
                        </div>
                        <div class="sm:col-span-2 space-y-1">
                            <label class="block text-[10px] uppercase tracking-widest text-gray-500 mb-1.5 font-bold">Amount to Pay (FRW)</label>
                            <div class="w-full min-h-[48px] flex items-center bg-zinc-800 border border-zinc-700 px-3 py-3 text-sm text-fof-accent font-bold outline-none rounded-sm" x-text="(selectedProduct ? totalPrice : grandTotal) + ' FRW'"></div>
                        </div>
                    </div>
                </div>

                <!-- Payment Details Section -->
                <div class="space-y-4">
                    <h4 class="text-[10px] uppercase tracking-[0.2em] text-fof-accent font-bold">2. Payment Details</h4>
                    <div class="bg-black/40 border border-zinc-800 rounded-sm divide-y divide-zinc-800/50">
                        
                        <!-- Store Number -->
                        <div class="p-4 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4 group cursor-pointer" @click="copyToClipboard('*182*1*1*0781718450#', 'Number')">
                            <div>
                                <span class="block text-[10px] text-gray-500 uppercase font-bold tracking-widest mb-1">To (Store Number)</span>
                                <span class="font-mono text-white text-lg font-bold tracking-wider" x-text="'*182*1*1*0781718450#'"></span>
                            </div>
                            <div class="flex items-center space-x-2 px-3 py-2 bg-zinc-800/50 group-hover:bg-fof-accent group-hover:text-white transition-all rounded text-[10px] uppercase font-bold tracking-widest relative">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"/></svg>
                                <span>Copy</span>
                                <span x-show="copyFeedback === 'Number'" x-cloak class="absolute -bottom-8 left-1/2 -translate-x-1/2 bg-fof-accent text-white text-[10px] px-2 py-1 rounded whitespace-nowrap">Copied!</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Summary Breakdown -->
                <div class="space-y-4">
                    <h4 class="text-[10px] uppercase tracking-[0.2em] text-fof-accent font-bold">3. Order Summary</h4>
                    <div class="bg-black/20 p-4 border border-zinc-800 rounded-sm space-y-3">
                        <template x-if="selectedProduct">
                            <div class="flex justify-between items-start text-sm">
                                <span class="text-gray-400 max-w-[70%]" x-text="selectedProduct.name + ' (' + modalSize + ') x' + modalQuantity"></span>
                                <span class="font-mono font-bold" x-text="(parseFloat(selectedProduct.price) * parseInt(modalQuantity)).toFixed(2) + ' FRW'"></span>
                            </div>
                        </template>
                        <template x-if="!selectedProduct">
                            <div class="space-y-2">
                                <template x-for="item in cartItems">
                                    <div class="flex justify-between items-start text-xs border-b border-zinc-800/30 pb-2 last:border-0 last:pb-0">
                                        <span class="text-gray-400 max-w-[70%]" x-text="item.name + ' (x' + item.quantity + ')'"></span>
                                        <span class="font-mono" x-text="(parseFloat(item.price) * parseInt(item.quantity)).toFixed(2) + ' FRW'"></span>
                                    </div>
                                </template>
                            </div>
                        </template>
                        
                        <div class="flex justify-between items-center pt-3 mt-3 border-t border-zinc-700">
                            <span class="text-xs uppercase font-bold tracking-widest text-white">Total Amount</span>
                            <span class="text-xl font-display font-bold text-fof-accent" x-text="(selectedProduct ? totalPrice : grandTotal) + ' FRW'"></span>
                        </div>
                    </div>
                </div>

                <!-- Action Button -->
                <button @click="verifyPayment()" 
                        :disabled="loading"
                        class="w-full bg-green-600 hover:bg-green-500 text-white font-bold uppercase py-5 px-6 rounded-sm tracking-[0.2em] text-xs transition-all flex items-center justify-center space-x-3 group active:scale-[0.98] disabled:opacity-70 disabled:cursor-not-allowed">
                    <template x-if="!loading">
                        <div class="flex items-center space-x-3">
                            <span>Verify on WhatsApp</span>
                            <svg class="w-5 h-5 transition-transform group-hover:scale-110" fill="currentColor" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
                        </div>
                    </template>
                    <template x-if="loading">
                        <div class="flex items-center space-x-3">
                            <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                            <span>Processing...</span>
                        </div>
                    </template>
                </button>
            </div>
        </div>
    </div>

    <!-- @@FOOTER -->


    <script type="module" src="/src/js/main.js"></script>
</body>
</html>
